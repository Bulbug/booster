name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No gradlew is committed in this project (Android Studio regenerates it locally on
      # first sync), so CI installs Gradle itself and calls it directly instead of ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # Debug builds are auto-signed with Android's default debug keystore — installable for
      # testing on any device with "install from unknown sources" allowed, not for the Play Store.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameBoostX-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
